# The iPhone and iPad app (ios/).
#
#   core    the Rust core (ios/core) on Linux: fmt, clippy, tests. It builds
#           on the agent's shared crate (agent/core), so a change there
#           runs this too.
#   app     on a Mac: the core built for iOS into an XCFramework, the app
#           built for a simulator, and the package's tests.
#
#   testflight  after both, for a push to main only, and only once the
#           repository variable IOS_DEPLOY_ENABLED is "true": archive and
#           upload to TestFlight (ios/README.md, "Releasing"). Signing is
#           cloud-managed: the App Store Connect API key (Admin role) lets
#           xcodebuild create and fetch the certificate and profile.
#
# Convention (same as ci.yml): third-party actions are pinned to full commit
# SHAs.
name: iOS

on:
  pull_request:
    paths:
      - "ios/**"
      - "agent/core/**"
      - ".github/workflows/ios.yml"
      - "!ios/**.md"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "agent/core/**"
      - ".github/workflows/ios.yml"
      - "!ios/**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "27.0"
  # App Store Connect refuses a build number it has seen: run number + this.
  BUILD_OFFSET: 0

jobs:
  core:
    name: Core (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  app:
    name: App (build, test)
    runs-on: xcode-27 # GitHub's arm64 image with Xcode 27; move to macos-27 when it ships
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Build the core
        run: scripts/build-core.sh

      - name: Pick simulator
        id: sim
        run: |
          # Prefer the runtime that ships with the selected Xcode (e.g. iOS-27-0).
          RUNTIME="iOS-${XCODE_VERSION//./-}"
          UDID=$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME" \
            '[.devices | to_entries[] | select(.key | endswith($rt)) | .value[] | select(.name | startswith("iPhone"))][0].udid // empty')
          [ -n "$UDID" ] || { xcrun simctl list runtimes; exit 1; }
          echo "Using simulator $UDID ($RUNTIME)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project Daedalus.xcodeproj \
            -scheme Daedalus \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/build.log"

      # The package's auto-generated scheme picks up every test target.
      - name: Test DaedalusKit
        working-directory: ios/Packages/DaedalusKit
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme DaedalusKit \
            -destination "id=$UDID" \
            -resultBundlePath "$GITHUB_WORKSPACE/build/Tests.xcresult" 2>&1 | tee "$RUNNER_TEMP/test.log"

      # The tail of a failed xcodebuild log is its command list, not the
      # reason: print the errors last.
      - name: Errors
        if: failure()
        run: |
          grep -hE "(: error: |recorded an issue|✘|\*\* .* FAILED)" "$RUNNER_TEMP"/*.log | sort -u | head -150 || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: build/Tests.xcresult

  testflight:
    name: TestFlight (archive, upload)
    needs: [core, app]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.IOS_DEPLOY_ENABLED == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    # The App Store Connect key lives in this environment, restricted to
    # main, so no other workflow or branch can reach it.
    environment: testflight
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Build the core
        run: scripts/build-core.sh

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Daedalus.xcodeproj \
            -scheme Daedalus \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Daedalus.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=$(( RUN_NUMBER + BUILD_OFFSET ))

      - name: Export & upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Daedalus.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Summary
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "### Uploaded build $(( RUN_NUMBER + BUILD_OFFSET )) to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes 5 to 15 minutes; TestFlight then notifies internal testers." >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
