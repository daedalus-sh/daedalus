[package]
name = "daedalus-agent"
version = "0.31.0"
edition = "2021"
# The rustc of the nixpkgs the box builds it with (26.05); rust-toolchain.toml
# pins the same release for every other build.
rust-version = "1.95"
description = "The daedalus agent: keeps a machine on the network awake, reports on it, and updates itself."
repository = "https://github.com/daedalus-sh/daedalus"
license = "MIT"
publish = false
build = "build.rs"

# The shared crate (core/): what a node needs to be a node, built by this
# crate and by the iOS app's library (ios/core). A member, so one lock and
# one target directory serve both, and the gate checks it as a package.
[workspace]
members = [".", "core"]
default-members = [".", "core"]

[lib]
name = "daedalus_agent"
path = "src/lib.rs"

# The service and its verbs.
[[bin]]
name = "daedalus-agent"
path = "src/bin/daedalus-agent.rs"

# The tray: a windowless program in the desktop session that shows what the
# service reports (and on Windows and macOS supervises Claude Code). Separate
# binary so it can be a GUI-subsystem executable (no console window at
# logon) while the verbs keep their console. On Linux it links GTK, so it is
# built for glibc only; the static musl service is built without the `tray`
# feature (`--no-default-features --bin daedalus-agent`), which skips it.
[[bin]]
name = "daedalus-agent-tray"
path = "src/bin/daedalus-agent-tray.rs"
required-features = ["tray"]

[features]
default = ["tray"]
# The controller: the agent on the box (controller/), Linux only. Nix builds
# it with this; a node's release does not.
controller = []
# The tray's dependencies: tray-icon everywhere, tao's event loop and Login
# Items' status on macOS, GTK's on Linux.
tray = ["dep:tray-icon", "dep:tao", "dep:gtk", "dep:objc2-service-management", "dep:objc2-foundation"]

[dependencies]
# The key, the link, the tunnel, the envelope: core/src/lib.rs.
daedalus-core = { path = "core" }
anyhow = "1"
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
png = "0.18"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tiny_http = "0.12"
toml = "1"
# config.toml edited in place by `install` and a re-pin (config.rs), every
# other line, comment and table kept.
toml_edit = "0.25"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# The root helper's pattern selectors (root/): the regex engine the
# log filter already brings, not a second one.
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "meta"] }

# rustls as the link holds it (core/src/link/): the controller's key resolver
# (controller/rotation.rs) and santree's pipe (node/santree.rs) name its
# types. No C crypto: the link's provider is the shared crate's own.
rustls = { version = "0.23", default-features = false, features = ["std"] }
zeroize = "1"

# A log-in (enroll.rs), where a machine has a tunnel to log in for — macOS
# and Linux: the shared crate builds the tunnel there (boringtun, whose AEAD
# is ring's, a C library; gate.sh checks macOS with zig as ring's C
# compiler) and not on Windows, which builds no C crypto.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
# PKCE's verifier and challenge.
base64 = "0.22"
# Sign-in (enroll.rs): the loopback callback's query, read and built, and
# its one-time state compared in constant time. Both already in the tree.
form_urlencoded = "1"
subtle = "2"

# Windows and macOS: the OS's own TLS (SChannel, Security.framework) rather
# than rustls: the machine's trust store decides, and no C crypto library
# has to be cross-compiled to check a target from another OS.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "gzip", "native-tls"] }
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25", optional = true }
windows-service = "0.8"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_Dns",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Ioctl",
  "Win32_System_Performance",
  "Win32_System_Pipes",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The menu bar app: tray-icon draws the item, tao runs the main-thread event
# loop AppKit requires (no window is ever opened; the process is an
# accessory, so no Dock icon).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.25", optional = true }
tao = { version = "0.37", optional = true }
# Whether the user switched the service off in System Settings › Login
# Items (`SMAppService.statusForLegacyURL`), and opening that pane: the
# menu bar app's one read of Background Task Management. objc2 and
# objc2-foundation are tao's already.
objc2-service-management = { version = "0.3", optional = true, default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSString", "NSURL"] }
# Info.plist, the LaunchServices handlers and the install history read in
# process, binary or XML, from a bounded regular-file read (no `plutil`).
plist = { version = "1", default-features = false }

# Linux: rustls, so one static musl binary runs on any distribution without
# its OpenSSL. The trust store is the system's CA bundle
# (rustls-native-certs); Mozilla's roots (webpki-roots) are the fallback
# only when the system yields none — a container or a minimal image without
# ca-certificates (os/linux/mod.rs `tls`). The tray: GTK's main loop, and
# tray-icon over AppIndicator, which it loads at run time
# (libayatana-appindicator3); no libxdo, the menu has no accelerators.
[target.'cfg(target_os = "linux")'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "gzip", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
gtk = { version = "0.18", optional = true }
tray-icon = { version = "0.25", default-features = false, features = ["libappindicator"], optional = true }

# The app's TypeScript wire types are generated from this crate's types by a
# test (src/ts.rs), so ts-rs is a dev-dependency: no release binary links it.
[dev-dependencies]
# The shared crate's types derive `TS` for the same test, and its tests'
# helpers (the in-process WireGuard peer, the link's plain server config)
# stand behind this crate's.
daedalus-core = { path = "core", features = ["ts", "testing"] }
ts-rs = { version = "12", default-features = false, features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
